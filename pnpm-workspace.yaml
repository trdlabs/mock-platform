# pnpm 11 replaced `onlyBuiltDependencies` with `allowBuilds` (https://pnpm.io/settings#allowbuilds).
# The file carried a literal placeholder ("set this to true or false"), which pnpm reads as "no
# decision recorded" — so every plain `pnpm install` exited 1 on ERR_PNPM_IGNORED_BUILDS and CI only
# survived by passing --ignore-scripts. esbuild is a vitest/tsc transitive dep; approving its build
# is the decision that was never actually written down.
allowBuilds:
  esbuild: true
# Исключение из `minimumReleaseAge` — ПЕР-ВЕРСИЯ, а не пер-пакет и не глобально.
#
# Политика защищает от скомпрометированного СВЕЖЕГО релиза третьей стороны: сутки
# выдержки дают шанс заметить подмену до того, как она приедет в сборку. Наш
# собственный пакет под эту угрозу не подпадает по другой причине, чем «мы ему
# доверяем»: он выпущен нашим же workflow, и provenance-аттестации подтверждены
# У РЕЕСТРА, а не по логу публикации (`slsa.dev/provenance/v1`, gitHead
# 60d6d09 = мерж-коммит sdk#38).
#
# Форма записи существенна. Пер-версия означает, что следующий релиз снова
# выдержит окно либо потребует отдельного осознанного решения; исключение
# пер-пакет сняло бы защиту с ВСЕХ будущих версий разом и молча.
minimumReleaseAgeExclude:
  - '@trdlabs/sdk@0.17.0'
